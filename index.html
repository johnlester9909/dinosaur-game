<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dinosaur Cloud Jump</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🦖 Dinosaur Game</h1>

        <div class="score">
            Score:
            <span id="score">0</span>
        </div>


        <div id="game">

            <!-- CLOUD -->
            <div id="cloud">☁️</div>


            <!-- DINOSAUR + SPEECH -->
            <div id="dino-area">

                <div id="speech">HAHA!</div>

                <div id="speechbubble">🗨️</div>

                <div id="dino">🦖</div>

            </div>


            <!-- CACTUS -->
            <div id="cactus">🌵</div>


            <!-- GAME OVER -->
            <div id="game-over">

                <h2>GAME OVER!</h2>

                <p>
                    Score:
                    <span id="final-score">0</span>
                </p>

                <button id="restartBtn">
                    🔄 Restart
                </button>

            </div>

        </div>


        <p class="instruction">
            📱 <b>TAP</b> = Jump |
            <b>SWIPE UP</b> = Cloud
        </p>

    </div>


    <script src="script.js"></script>

</body>

  </html>
